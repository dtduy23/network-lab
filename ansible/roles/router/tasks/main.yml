---
- name: Check whether UFW is active on router
  ansible.builtin.command: ufw status
  environment: {LC_ALL: C}
  register: router_ufw
  changed_when: false

- name: Disable UFW only when active (avoid resetting an existing iptables policy)
  ansible.builtin.command: ufw --force disable
  when: "'Status: active' in router_ufw.stdout"
  changed_when: true

- name: Configure DHCP only on the LAN adapter
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/network-lab.conf
    mode: '0644'
  register: lab_dhcp

- name: Check DHCP configuration
  ansible.builtin.command: dnsmasq --test --conf-file=/etc/dnsmasq.d/network-lab.conf
  changed_when: false

- name: Render IPv4 routing and firewall policy
  ansible.builtin.template:
    src: iptables.rules.j2
    dest: /etc/network-lab/iptables.rules
    mode: '0600'
  register: lab_firewall

- name: Validate iptables policy
  ansible.builtin.shell: iptables-restore --test < /etc/network-lab/iptables.rules
  changed_when: false

- name: Install persistent firewall unit
  ansible.builtin.copy:
    src: lab-firewall.service
    dest: /etc/systemd/system/lab-firewall.service
    mode: '0644'
  register: lab_firewall_unit

- name: Inspect live default policies before deciding whether to reload
  ansible.builtin.command: iptables -S
  register: live_router_policy
  changed_when: false

- name: Detect policy drift, including defaults reset by other firewall managers
  ansible.builtin.set_fact:
    router_policy_drift: "{{ '-P INPUT DROP' not in live_router_policy.stdout or '-P FORWARD DROP' not in live_router_policy.stdout }}"

- name: Enable firewall at boot without clearing unrelated tables
  ansible.builtin.systemd_service:
    name: lab-firewall
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if lab_firewall.changed or lab_firewall_unit.changed or router_policy_drift else 'started' }}"

- name: Rebuild Fail2ban chains after replacing the router filter table
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: lab_firewall.changed or lab_firewall_unit.changed or router_policy_drift

- name: Install an explicit DHCP systemd unit
  ansible.builtin.copy:
    src: dnsmasq.service
    dest: /etc/systemd/system/dnsmasq.service
    mode: '0644'
  register: lab_dhcp_unit

- name: Enable DHCP
  ansible.builtin.systemd_service:
    name: dnsmasq
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if lab_dhcp.changed or lab_dhcp_unit.changed else 'started' }}"
