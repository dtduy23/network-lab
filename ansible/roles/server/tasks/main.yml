---
- name: Create DNS zone directory
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: '0755'

- name: Configure DNS options and zones
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: bind
    mode: '0644'
  loop:
    - {src: named.conf.options.j2, dest: /etc/bind/named.conf.options}
    - {src: named.conf.local.j2, dest: /etc/bind/named.conf.local}
    - {src: db.forward.j2, dest: /etc/bind/zones/db.infra.test}
    - {src: db.dmz.reverse.j2, dest: /etc/bind/zones/db.10.20.10}
    - {src: db.lan.reverse.j2, dest: /etc/bind/zones/db.10.20.20}
  register: lab_bind

- name: Validate all DNS zones before restart
  ansible.builtin.command: named-checkconf -z
  changed_when: false

- name: Enable BIND9
  ansible.builtin.service:
    name: named
    enabled: true
    state: "{{ 'restarted' if lab_bind.changed else 'started' }}"

- name: Create website and TLS directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: [/var/www/network-lab, /etc/nginx/network-lab-tls]

- name: Install demonstration website
  ansible.builtin.copy:
    src: index.html
    dest: /var/www/network-lab/index.html
    mode: '0644'

- name: Generate a lab-only self-signed certificate with SAN
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - '365'
      - -keyout
      - /etc/nginx/network-lab-tls/server.key
      - -out
      - /etc/nginx/network-lab-tls/server.crt
      - -subj
      - "/CN=www.{{ lab_domain }}"
      - -addext
      - "subjectAltName=DNS:www.{{ lab_domain }},DNS:{{ lab_domain }},IP:{{ lab_server_ip }}"
    creates: /etc/nginx/network-lab-tls/server.crt

- name: Restrict the TLS private key
  ansible.builtin.file:
    path: /etc/nginx/network-lab-tls/server.key
    mode: '0600'

- name: Configure Nginx service
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/network-lab
    mode: '0644'
  register: lab_nginx

- name: Enable the lab site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/network-lab
    dest: /etc/nginx/sites-enabled/network-lab
    state: link
  register: lab_nginx_link

- name: Remove distro default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  register: lab_nginx_default

- name: Check Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: "{{ 'restarted' if lab_nginx.changed or lab_nginx_link.changed or lab_nginx_default.changed else 'started' }}"

- name: Restrict PostgreSQL to local sockets and loopback
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = 'localhost'"
  register: lab_pg_listen

- name: Enable PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: "{{ 'restarted' if lab_pg_listen.changed else 'started' }}"

- name: Check whether demonstration database exists
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -tAc, "SELECT 1 FROM pg_database WHERE datname='{{ lab_database }}'"]
  register: lab_db_exists
  changed_when: false

- name: Create demonstration database
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, createdb, -T, template0, "{{ lab_database }}"]
  when: lab_db_exists.stdout | trim != '1'
  changed_when: true

- name: Install repeatable demonstration SQL
  ansible.builtin.copy:
    src: seed.sql
    dest: /etc/network-lab/seed.sql
    mode: '0644'

- name: Initialize the demonstration table without overwriting existing data
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -v, ON_ERROR_STOP=1, -d, "{{ lab_database }}"]
    stdin: "{{ lookup('ansible.builtin.file', role_path + '/files/seed.sql') }}"
  changed_when: false

- name: Apply endpoint firewall
  ansible.builtin.include_role:
    name: endpoint
